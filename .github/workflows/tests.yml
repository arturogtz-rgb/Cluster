name: Tests

on:
  push:
    branches: [main, mejoras-jul2026]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Start backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: turismo_jalisco_test
          JWT_SECRET: test-secret-key-for-ci-only
          CORS_ORIGINS: http://localhost
        run: |
          cd backend
          python -m uvicorn server:app --host 0.0.0.0 --port 8001 &
          sleep 5
          curl -s http://localhost:8001/api/ || echo "Backend may not be ready"

      - name: Run tests
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: turismo_jalisco_test
          JWT_SECRET: test-secret-key-for-ci-only
          CORS_ORIGINS: http://localhost
          REACT_APP_BACKEND_URL: http://localhost:8001
        run: |
          cd backend
          python -m pytest tests/test_pst_affiliation.py tests/test_bloque_d.py tests/test_bloque_c_payments.py -v --tb=short
